<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advocate</title>
  <link rel="stylesheet" href="style.css">
  <script>
    if (window.location.search.includes("mock=1")) {
      document.write('<script src="mock.js"><\/script>');
    }
  </script>
</head>
<body id="app">
  <div id="connection-overlay" class="hidden">
    <div class="overlay-content">
      <p>Connection lost.</p>
      <button id="retry-btn">Retry Connection</button>
    </div>
  </div>

  <header style="padding: 1rem 2rem; background-color: var(--bubble-landlord); border-bottom: 2px solid var(--border-color); display: flex; align-items: baseline; gap: 1rem;">
    <h1 style="margin: 0; font-size: 2rem;">Advocate</h1>
    <span style="font-size: 1.2rem; opacity: 0.8; font-style: italic;">Speak up, in any language</span>
  </header>

  <div class="main-layout">
    <!-- LEFT: Conversation -->
    <div class="left-panel">
      <div class="status-bar">
        <span id="status-indicator">Listening</span>
        <div id="waveform" class="waveform"></div>
      </div>
      <div id="conversation" class="conversation" aria-live="polite">
        <!-- Chat bubbles appear here -->
      </div>
    </div>

    <!-- RIGHT: Advocate Panel -->
    <div class="right-panel">
      <div class="tabs">
        <button id="tab-advocate" class="tab active" aria-selected="true">Advocate</button>
        <button id="tab-score" class="tab" aria-selected="false">Score</button>
      </div>
      
      <div id="advocate-view" class="tab-content active">
        <div id="promises-list" class="promises-list">
          <h3>Promises so far</h3>
          <ul id="promises-ul"></ul>
        </div>
        <div id="flags-list" class="flags-list">
          <h3>Recent Flags</h3>
          <div id="flags-container"></div>
        </div>
      </div>

      <div id="score-view" class="tab-content hidden">
        <h3>Evaluation Score</h3>
        <pre id="score-output">Loading results...</pre>
      </div>
    </div>
  </div>

  <!-- BOTTOM: Controls -->
  <div class="bottom-panel">
    <div class="controls-left">
      <div style="display:flex; gap:1rem; align-items:center;">
        <select id="tenant-lang" aria-label="Tenant Language">
          <option value="uk" selected>Ukrainian</option>
          <option value="ru">Russian</option>
          <option value="es">Spanish</option>
          <option value="zh">Chinese</option>
          <option value="en">English</option>
        </select>
        <button id="mic-btn" class="mic-btn" aria-label="Hold space to talk" title="Hold Space to talk">
          🎤 Push to Talk
        </button>
        <label style="display:flex; align-items:center; gap:0.2rem; cursor:pointer; font-size: 0.9rem;">
          <input type="checkbox" id="mute-toggle" /> Mute Audio
        </label>
      </div>
      <input type="text" id="tenant-text-input" placeholder="Type tenant text (fallback)" style="margin-top:0.5rem; padding:0.5rem; border-radius:4px; border:1px solid #ccc; width:100%;" aria-label="Tenant typed fallback" />
    </div>
    
    <div class="controls-center">
      <details class="simulator-drawer">
        <summary>Landlord Simulator</summary>
        <div id="simulator-lines" class="simulator-lines">
          <!-- Populated from mock.js window.landlordLines -->
        </div>
      </details>
    </div>

    <div class="controls-right">
      <button id="approve-btn" disabled>Approve and prepare summary</button>
    </div>
  </div>

  <footer>
    <p>Not legal advice. Flags are candidates. Nothing is sent.</p>
  </footer>

  <!-- Modal for Summary -->
  <dialog id="summary-dialog">
    <div class="dialog-content">
      <h2>Summary</h2>
      <div id="summary-content"></div>
      <button id="close-summary">Close</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
